services:
  postgres:
    image: postgres:15-alpine
    container_name: assistant_postgres
    restart: always
    environment:
      POSTGRES_DB: assistant_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - assistant_net

  redis:
    image: redis:7-alpine
    container_name: assistant_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - assistant_net

volumes:
  pgdata:

networks:
  assistant_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
